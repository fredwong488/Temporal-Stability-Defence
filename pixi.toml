[workspace]
authors = ["fredwong488 <67003534+fredwong488@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "Imperial-paper-implementations"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
large-ora-sweep = {cmd = "python scripts/run_ora_sweep.py --num-frames 3000 --classes Car Pedestrian Cyclist --difficulties Easy Moderate Hard --metric-types ap pr recall_iou --budgets 0 10 20 40 60 100 150 200"}
small-ora-sweep = {cmd = "python scripts/run_ora_sweep.py --num-frames 50 --classes Car Pedestrian Cyclist --difficulties Easy Moderate Hard --metric-types ap pr recall_iou --budgets 0 10 20 40 60 100 150 200"}
test-ora-sweep = {cmd = "python scripts/run_ora_sweep.py --num-frames 50 --classes Car Pedestrian Cyclist --difficulties Easy Moderate Hard --metric-types ap pr recall_iou --budgets 0 40 100 200"}
format-metrics = {cmd = "python tools/format_metrics.py"}
visualise-metrics = {cmd = "python tools/visualise_metrics.py"}

# Task aliases
l-ora = [{ task = "large-ora-sweep" }]
s-ora = [{ task = "small-ora-sweep" }]
t-ora = [{ task = "test-ora-sweep" }]
fm = [{ task = "format-metrics" }]
vm = [{ task = "visualise-metrics" }]

[system-requirements]
cuda = "11.8"

[dependencies]
python = ">=3.11.0,<3.12"
numpy = ">2"
matplotlib = "*"
joblib = "*"
scikit-learn = "*"
discretize = "*"
ipykernel = "*"
llvm-openmp = "*"
open3d = "*"  
shapely = "*"
llvmlite = "*"
numba = "*"
tensorboardx = "*"
easydict = "*"
pyyaml = "*"
scikit-image = "*"
tqdm = "*"
opencv = "*"
pip = "*"

[target.linux-64.dependencies]


[target.osx-arm64.pypi-dependencies]
torch = "*"
torchvision = "*"

[target.linux-64.pypi-dependencies]
torch = { version = ">=2", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { index = "https://download.pytorch.org/whl/cu118" }
spconv-cu118 = "*"
SharedArray = "*"
pyquaternion = "*"
