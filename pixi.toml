[workspace]
authors = ["fredwong488 <67003534+fredwong488@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "Imperial-paper-implementations"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[system-requirements]
cuda = "12.0"

[dependencies]
python = ">=3.11.0,<3.12"
numpy = ">2"
matplotlib = "*"
joblib = "*"
scikit-learn = "*"
discretize = "*"
ipykernel = "*"
llvm-openmp = "*"
open3d = "*"  
shapely = "*"
llvmlite = "*"
numba = "*"
tensorboardx = "*"
easydict = "*"
pyyaml = "*"
scikit-image = "*"
tqdm = "*"
opencv = "*"
pip = "*"

[target.linux-64.dependencies]
pytorch-cuda = "*"
pytorch-gpu = ">=2"
torchvision = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
torchvision = "*"

[target.linux-64.pypi-dependencies]
spconv-cu120 = "*"
SharedArray = "*"
pyquaternion = "*"
